<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birds Beyond Sight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Radio+Canada+Big:ital,wght@0,400..700;1,400..700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1a1a;
  --muted:#6C6C6C;
  --green:#009B49;
  --font:'Radio Canada Big',sans-serif;
  --font-sub:'Source Serif 4',Georgia,serif;
}
html{font-size:16px}
body{
  font-family:var(--font);color:var(--ink);background:#fff;
  min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;
}
.hero{
  width:100%;
  height:clamp(180px, 28vw, 280px);
  overflow:hidden;
  background:#1a1a1a;
  margin:0;
}
.hero img{
  width:100%;height:100%;object-fit:cover;object-position:center 40%;
  display:block;
  filter:saturate(1.05) contrast(1.02);
}
.page{
  max-width:960px;width:100%;
  margin:0 auto;padding:56px 28px 80px;
  text-align:left;
}
.masthead{
  margin:0 0 68px;
  padding:0 18px;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:16px 24px;
  flex-wrap:wrap;
}
h1{
  font-size:1.65rem;font-weight:700;letter-spacing:-.02em;margin:0;
  color:var(--ink);
}
.lede{
  font-family:var(--font-sub);font-size:.95rem;color:var(--muted);
  line-height:1.45;max-width:none;margin:0;
}
.cols{
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  gap:36px 48px;
  align-items:start;
  padding:0 18px;
}
@media (max-width:820px){
  .cols{grid-template-columns:1fr;gap:36px}
  .hero{height:clamp(150px, 38vw, 220px)}
  h1{font-size:1.4rem}
  .lede{font-size:.85rem}
}
.block{margin:0;min-width:0}
.block h2{
  font-family:var(--font-sub);font-size:.9rem;font-weight:400;
  color:var(--muted);margin:0 0 8px;padding:0;
  letter-spacing:-.01em;
}
ul{list-style:none;padding:0;margin:0}
li a{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:7px 0;margin:0;
  color:var(--ink);text-decoration:none;font-size:1rem;font-weight:400;
  letter-spacing:-.01em;line-height:1.3;
}
li a:hover{color:var(--green)}
li a .arrow{opacity:0;color:var(--muted);font-size:.85rem;transition:opacity .15s}
li a:hover .arrow{opacity:1}

.hover-peek{
  position:fixed;pointer-events:none;z-index:40;
  width:220px;
  opacity:0;transform:translate(-10%,-108%) scale(.94);
  transition:opacity .15s ease, transform .15s ease;
}
.hover-peek.on{
  opacity:1;transform:translate(-10%,-108%) scale(1);
}
.page-card{
  width:100%;aspect-ratio:16 / 10;
  border-radius:10px;overflow:hidden;
  box-shadow:0 14px 36px rgba(0,0,0,.2);
  border:2px solid #fff;background:#eee;
  position:relative;
}
.page-card iframe{
  position:absolute;top:0;left:0;
  width:1280px;height:800px;
  border:0;
  transform:scale(0.171875);
  transform-origin:top left;
  pointer-events:none;
}
</style>
</head>
<body>
<div class="hero" aria-hidden="true">
  <img src="assets/birds/hero.avif" alt="">
</div>
<main class="page">
  <header class="masthead">
    <h1>Birds Beyond Sight</h1>
    <p class="lede">Katarina Blind, Catherine Fu and Jax Powell</p>
  </header>

  <div class="cols">
    <section class="block" aria-labelledby="usability-h">
      <h2 id="usability-h">Usability Test</h2>
      <ul>
        <li><a href="merlin-prototype.html">Test 1<span class="arrow">→</span></a></li>
        <li><a href="merlin-hifi.html">Test 2<span class="arrow">→</span></a></li>
        <li><a href="study.html">Test 2 Facilitation<span class="arrow">→</span></a></li>
        <li><a href="sr-layers.html">Screen Reader Debug<span class="arrow">→</span></a></li>
        <li><a href="lv-anatomy.html">Low Vision Debug<span class="arrow">→</span></a></li>
      </ul>
    </section>

    <section class="block" aria-labelledby="ideation-h">
      <h2 id="ideation-h">Ideation</h2>
      <ul>
        <li><a href="playground.html">Playground<span class="arrow">→</span></a></li>
        <li><a href="dashboard.html">Insights<span class="arrow">→</span></a></li>
        <li><a href="place-feed-v3.html">Categories<span class="arrow">→</span></a></li>
      </ul>
    </section>

    <section class="block" aria-labelledby="codesign-h">
      <h2 id="codesign-h">Co-Design</h2>
      <ul>
        <li><a href="index-soundboard-archive.html">Bird DJ<span class="arrow">→</span></a></li>
        <li><a href="bird-composition.html">Bird DJ Facilitation<span class="arrow">→</span></a></li>
      </ul>
    </section>
  </div>
</main>

<div class="hover-peek" id="hover-peek" aria-hidden="true">
  <div class="page-card"><iframe id="page-preview" title="" tabindex="-1" loading="lazy"></iframe></div>
</div>

<script>
(function () {
  const peek = document.getElementById('hover-peek');
  const frame = document.getElementById('page-preview');
  let active = null;
  let lastHref = '';

  // Hover thumbnails can deep-link into a better first view of the page.
  const PREVIEW = {
    'playground.html': 'playground.html?tab=gallery',
  };

  document.querySelectorAll('.cols a[href]').forEach(link => {
    link.addEventListener('mouseenter', () => {
      active = link;
      const href = link.getAttribute('href');
      const src = PREVIEW[href] || href;
      if (src && src !== lastHref) {
        lastHref = src;
        frame.src = src;
      }
      peek.classList.add('on');
    });
    link.addEventListener('mousemove', (e) => {
      peek.style.left = e.clientX + 18 + 'px';
      peek.style.top = e.clientY + 'px';
    });
    link.addEventListener('mouseleave', () => {
      if (active === link) {
        active = null;
        peek.classList.remove('on');
      }
    });
  });
})();
</script>
</body>
</html>
