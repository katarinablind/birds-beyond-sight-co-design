<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Low vision debug · Merle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Radio+Canada+Big:ital,wght@0,400..700;1,400..700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1a1a;
  --muted:#6C6C6C;
  --line:#e8e6e1;
  --bg:#e5e5ea;
  --panel:#fff;
  --green:#009B49;
  --font:'Radio Canada Big',sans-serif;
  --font-sub:'Source Serif 4',Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);background:var(--bg);
  overflow:hidden;
}
a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
a:hover{opacity:.65}

.shell{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(260px,300px);
  height:100%;
}
@media (max-width:820px){
  .shell{grid-template-columns:1fr;grid-template-rows:minmax(420px,1fr) auto;overflow:auto;height:auto;min-height:100dvh}
  html,body{overflow:auto;height:auto}
}

.stage{
  min-width:0;min-height:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:18px 16px 24px;
}
.page-tabs{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.page-tabs button{
  font:inherit;font-size:.68rem;font-weight:600;padding:5px 10px;border-radius:999px;
  border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);
}
.page-tabs button[aria-current="page"]{background:var(--green);border-color:var(--green);color:#fff}

.preview-phone{
  width:390px;
  height:844px;
  border-radius:28px;overflow:hidden;
  border:1px solid #1c1c1e;
  box-shadow:0 0 0 8px #2c2c2e, 0 24px 48px -12px rgba(0,0,0,.35);
  background:#fff;
  position:relative;
  flex:none;
}
.preview-zoom{
  position:absolute;inset:0;
  overflow:hidden;
}
.preview-zoom iframe{
  display:block;width:390px;height:844px;border:0;
  transform-origin:0 0;
}

.side{
  background:var(--panel);border-left:1px solid var(--line);
  padding:18px 16px 20px;
  display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto;
}
@media (max-width:820px){
  .side{border-left:0;border-top:1px solid var(--line)}
}
.side h1.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;
}
.side-label{
  font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
}
.field .hint{
  font-family:var(--font-sub);font-size:.68rem;color:var(--muted);line-height:1.4;margin-top:6px;
}

.size-options{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.size-options button{
  font:inherit;text-align:left;cursor:pointer;
  padding:10px 11px;border-radius:10px;border:1px solid var(--line);
  background:#fafafa;color:var(--ink);
}
.size-options button:hover{border-color:#c9ccd0}
.size-options button[aria-pressed="true"]{
  border-color:var(--ink);background:#fff;
  box-shadow:inset 0 0 0 1px var(--ink);
}
.size-options .sz{display:block;font-size:.8rem;font-weight:700}
.size-options .hint{display:block;margin-top:2px;font-size:.68rem;font-weight:500;color:var(--muted)}

.toggles{display:flex;flex-direction:column;gap:8px}
.toggle{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:#fafafa;cursor:pointer;user-select:none;text-align:left;
}
.toggle:hover{border-color:#c9ccd0}
.toggle[aria-pressed="true"]{
  border-color:var(--ink);background:#fff;
  box-shadow:inset 0 0 0 1px var(--ink);
}
.toggle .name{font-size:.8rem;font-weight:600}
.toggle .hint{font-family:var(--font-sub);font-size:.68rem;color:var(--muted);margin-top:2px}
.toggle .sw{
  flex:none;width:36px;height:22px;border-radius:999px;background:#d0d0d4;position:relative;
  transition:background .15s;
}
.toggle .sw::after{
  content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s;
}
.toggle[aria-pressed="true"] .sw{background:var(--green)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(14px)}

.reset{
  font:inherit;font-size:.72rem;font-weight:600;padding:8px 12px;border-radius:8px;
  border:1px solid var(--line);background:#fff;cursor:pointer;align-self:flex-start;
}
.reset:hover{border-color:var(--ink)}

.links{
  margin-top:auto;padding-top:12px;
  font-family:var(--font-sub);font-size:.7rem;color:var(--muted);line-height:1.45;
}
</style>
</head>
<body>
<div class="shell">
  <section class="stage" aria-label="Preview">
    <div class="page-tabs" id="page-tabs" role="tablist" aria-label="Merle screens">
      <button type="button" data-start="s-identify" aria-current="page">Identify</button>
      <button type="button" data-start="s-save">Save</button>
      <button type="button" data-start="s-history-date">Date</button>
      <button type="button" data-start="s-history-species">Species</button>
      <button type="button" data-start="s-history-location">Location</button>
    </div>
    <div class="preview-phone" id="preview-phone">
      <div class="preview-zoom" id="preview-zoom">
        <iframe id="proto-frame" title="Merle prototype preview" src="merlin-hifi.html?start=s-identify&modal=0&textscale=1"></iframe>
      </div>
    </div>
  </section>

  <aside class="side" aria-label="Display settings">
    <h1 class="sr-only">Low vision debug</h1>
    <div class="side-label">Screen settings</div>

    <div class="field">
      <div class="side-label" style="margin-bottom:8px">Larger text</div>
      <div class="size-options" id="size-options" role="group" aria-label="Text size">
        <button type="button" data-scale="1" aria-pressed="true">
          <span class="sz">Default</span>
          <span class="hint">100%</span>
        </button>
        <button type="button" data-scale="1.15" aria-pressed="false">
          <span class="sz">Comfortable</span>
          <span class="hint">115%</span>
        </button>
        <button type="button" data-scale="1.3" aria-pressed="false">
          <span class="sz">Large</span>
          <span class="hint">130%</span>
        </button>
        <button type="button" data-scale="1.45" aria-pressed="false">
          <span class="sz">Extra large</span>
          <span class="hint">145%</span>
        </button>
        <button type="button" data-scale="1.6" aria-pressed="false">
          <span class="sz">Huge</span>
          <span class="hint">160%</span>
        </button>
        <button type="button" data-scale="1.8" aria-pressed="false">
          <span class="sz">Maximum</span>
          <span class="hint">180%</span>
        </button>
      </div>
      <p class="hint">Same sizes as the study text-size choice — sets Merle’s <code>--text-scale</code> so type reflows inside the phone.</p>
    </div>

    <div class="toggles" role="group" aria-label="Display filters">
      <button type="button" class="toggle" id="toggle-contrast" aria-pressed="false">
        <span>
          <span class="name">Increase contrast</span>
          <div class="hint">Stronger contrast, like accessibility display boost</div>
        </span>
        <span class="sw" aria-hidden="true"></span>
      </button>
      <button type="button" class="toggle" id="toggle-invert" aria-pressed="false">
        <span>
          <span class="name">Invert</span>
          <div class="hint">Classic color invert</div>
        </span>
        <span class="sw" aria-hidden="true"></span>
      </button>
      <button type="button" class="toggle" id="toggle-gray" aria-pressed="false">
        <span>
          <span class="name">Grayscale</span>
          <div class="hint">Color filters → grayscale</div>
        </span>
        <span class="sw" aria-hidden="true"></span>
      </button>
    </div>

    <button type="button" class="reset" id="reset">Reset</button>

    <p class="links">
      <a href="index.html">Wiki</a> ·
      <a href="sr-layers.html">Screen reader debug</a> ·
      <a href="merlin-hifi.html">Merle</a>
    </p>
  </aside>
</div>

<script>
const frame = document.getElementById('proto-frame');
const phone = document.getElementById('preview-phone');
const sizeOptions = document.getElementById('size-options');
const contrastBtn = document.getElementById('toggle-contrast');
const invertBtn = document.getElementById('toggle-invert');
const grayBtn = document.getElementById('toggle-gray');

const state = {
  scale: 1,
  start: 's-identify',
  contrast: false,
  invert: false,
  gray: false,
};

function pressed(btn, on) {
  btn.setAttribute('aria-pressed', String(on));
}

function protoUrl() {
  return `merlin-hifi.html?start=${state.start}&modal=0&textscale=${state.scale}`;
}

function fitPhone() {
  const stage = phone.parentElement;
  const maxW = Math.min(390, Math.max(200, (stage?.clientWidth || 420) - 32));
  const maxH = Math.min(844, Math.max(320, window.innerHeight - 90));
  const s = Math.min(maxW / 390, maxH / 844);
  // Keep a true 390×844 phone; scale the iframe to fill it exactly.
  phone.style.width = `${390 * s}px`;
  phone.style.height = `${844 * s}px`;
  frame.style.transform = `scale(${s})`;
  frame.style.transformOrigin = '0 0';
}

function pushTextScale() {
  // Same mechanism as study continue: set --text-scale on Merle’s root.
  try {
    frame.contentWindow?.postMessage({ type: 'merle-text-scale', scale: state.scale }, '*');
  } catch (_) {}
  try {
    frame.contentDocument?.documentElement?.style.setProperty('--text-scale', String(state.scale));
  } catch (_) {}
}

function applyFilters() {
  const filters = [];
  if (state.invert) filters.push('invert(1)');
  if (state.gray) filters.push('grayscale(1)');
  if (state.contrast) filters.push('contrast(1.55)');
  frame.style.filter = filters.length ? filters.join(' ') : 'none';
}

function syncSizeButtons() {
  sizeOptions.querySelectorAll('[data-scale]').forEach(btn => {
    const match = Math.abs(parseFloat(btn.dataset.scale) - state.scale) < 0.001;
    btn.setAttribute('aria-pressed', String(match));
  });
}

function setScale(scale, { reload = false } = {}) {
  state.scale = scale;
  syncSizeButtons();
  if (reload) {
    frame.src = protoUrl();
  } else {
    pushTextScale();
  }
}

function syncUI() {
  syncSizeButtons();
  pressed(contrastBtn, state.contrast);
  pressed(invertBtn, state.invert);
  pressed(grayBtn, state.gray);
  applyFilters();
  fitPhone();
  pushTextScale();
}

sizeOptions.querySelectorAll('[data-scale]').forEach(btn => {
  btn.addEventListener('click', () => setScale(parseFloat(btn.dataset.scale)));
});

contrastBtn.addEventListener('click', () => {
  state.contrast = !state.contrast;
  syncUI();
});
invertBtn.addEventListener('click', () => {
  state.invert = !state.invert;
  syncUI();
});
grayBtn.addEventListener('click', () => {
  state.gray = !state.gray;
  syncUI();
});

document.getElementById('reset').addEventListener('click', () => {
  state.scale = 1;
  state.contrast = false;
  state.invert = false;
  state.gray = false;
  syncUI();
  frame.src = protoUrl();
});

document.getElementById('page-tabs').querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById('page-tabs').querySelectorAll('button').forEach(b => {
      b.setAttribute('aria-current', b === btn ? 'page' : 'false');
    });
    state.start = btn.dataset.start;
    frame.src = protoUrl();
  });
});

frame.addEventListener('load', () => {
  fitPhone();
  applyFilters();
  // Re-apply after Merle boots (covers file:// / late listener cases)
  pushTextScale();
  setTimeout(pushTextScale, 50);
});

new ResizeObserver(() => fitPhone()).observe(phone.parentElement || phone);
window.addEventListener('resize', fitPhone);
syncUI();
</script>
</body>
</html>
